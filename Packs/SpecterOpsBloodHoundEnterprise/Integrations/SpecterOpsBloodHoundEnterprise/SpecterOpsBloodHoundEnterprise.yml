sectionorder:
- Connect
- Collect
commonfields:
  id: SpecterOpsBloodHoundEnterprise
  version: -1
name: SpecterOpsBloodHoundEnterprise
display: SpecterOps BloodHound Enterprise
category: Vulnerability Management
provider: SpecterOps
description: Use the SpecterOpsBloodHoundEnterprise integration to retrieve attack path findings from BloodHound Enterprise to streamline incident creation and investigation.
detaileddescription: BloodHound Enterprise reduces risk in Active Directory and Microsoft Azure environments by continuously identifying and quantifying attack paths that attackers use to escalate privileges. The SpecterOpsBloodHoundEnterprise integration automatically ingests attack path findings from BloodHound Enterprise into Cortex XSOAR, streamlining incident creation and investigation. Configure the integration by providing your BloodHound Enterprise domain, API token ID and key, and optionally configure proxy settings and finding filters. Enable incident fetching to automatically retrieve attack paths at your specified interval. When Create indicators is enabled (default), principals on newly ingested attack paths are saved as User, Computer, or Group indicators.
configuration:
- section: Connect
  display: BloodHound Enterprise Domain
  name: url
  type: 0
  required: true
  additionalinfo: BloodHound Enterprise Domain URL
- section: Connect
  display: Token ID
  displaypassword: Token Key
  name: credentials
  type: 9
  required: true
  additionalinfo: BloodHound Enterprise API token ID
- section: Connect
  display: Proxy URL
  name: proxy_url
  type: 0
  required: false
- section: Connect
  display: Proxy URL Username
  name: proxy_username
  type: 0
  required: false
- section: Connect
  display: Proxy URL Password
  name: proxy_password
  type: 4
  required: false
- section: Connect
  display: Finding Environment
  name: finding_domain
  defaultvalue: all
  type: 0
  required: false
  additionalinfo: The environment from which to fetch attack paths. Default is all.
- section: Connect
  display: Finding Category
  name: finding_category
  defaultvalue: all
  type: 0
  required: false
  additionalinfo: The category of attack paths to fetch. Default is all.
- section: Collect
  display: Fetch incidents
  name: isFetch
  type: 8
  required: false
- section: Collect
  display: Create indicators
  name: create_indicators
  type: 8
  defaultvalue: true
  required: false
  additionalinfo: When enabled (default), each fetch creates or updates User, Computer, and Group indicators for principals on newly ingested attack paths. Previously fetched paths and existing indicators are not changed.
- section: Collect
  display: Incidents Fetch Interval
  name: incidentFetchInterval
  defaultvalue: "10"
  type: 19
  required: false
  additionalinfo: The interval for fetching attack paths.
- section: Collect
  display: Incident type
  name: incidentType
  type: 13
  required: false
script:
  script: '-'
  commands:
  - name: bloodhound-object-id-get
    arguments:
    - name: object_names
      required: true
      description: The object name associated with object ID.
      isArray: true
    outputs:
    - contextPath: SpecterOpsBloodHoundEnterprise.Object.Status
      description: The status of the object ID lookup (success or error).
      type: string
    - contextPath: SpecterOpsBloodHoundEnterprise.Object.Message
      description: The message describing the result of the lookup.
      type: string
    - contextPath: SpecterOpsBloodHoundEnterprise.Object.ObjectID
      description: The unique object ID of the found object.
      type: string
    - contextPath: 'SpecterOpsBloodHoundEnterprise.Object.ObjectName'
      description: The name of the object that was searched.
      type: string
    description: Fetches the object ID using the object name.
  - name: bloodhound-asset-info-get
    arguments:
    - name: object_ids
      required: true
      description: The object ID to fetch asset information.
      isArray: true
    outputs:
    - contextPath: SpecterOpsBloodHoundEnterprise.Asset.Status
      description: The status of the asset information fetch (success or error).
      type: string
    - contextPath: SpecterOpsBloodHoundEnterprise.Asset.Message
      description: The message describing the result of the asset information fetch.
      type: string
    - contextPath: SpecterOpsBloodHoundEnterprise.Asset.ObjectID
      description: The object ID for which asset information was fetched.
      type: string
    - contextPath: SpecterOpsBloodHoundEnterprise.Asset.Data
      description: The raw asset data containing all asset information fields (name, type, objectid, domain, enabled, email, and other properties).
      type: unknown
    description: Fetches asset information using the object ID.
  - name: bloodhound-path-exist
    arguments:
    - name: from_principal
      description: The start node.
    - name: to_principal
      description: The end node.
    outputs:
    - contextPath: SpecterOpsBloodHoundEnterprise.Path.FromPrincipal
      description: The start node (from principal) used in the path check.
      type: String
    - contextPath: SpecterOpsBloodHoundEnterprise.Path.ToPrincipal
      description: The end node (to principal) used in the path check.
      type: String
    - contextPath: SpecterOpsBloodHoundEnterprise.Path.Status
      description: The status of the path check (success or error).
      type: String
    - contextPath: SpecterOpsBloodHoundEnterprise.Path.Message
      description: The message describing the result of the path check.
      type: String
    - contextPath: SpecterOpsBloodHoundEnterprise.Path.Data
      description: Whether a path exists between the nodes (True or False).
      type: Boolean
    description: Checks if a path exists between the two nodes.
  - name: bloodhound-principal-impact-get
    arguments:
    - name: name
      required: true
      description: Indicator value to resolve in BloodHound Enterprise.
    - name: indicator_type
      required: true
      description: Indicator type. User, Computer, or Group.
      predefined:
      - User
      - Computer
      - Group
    - name: view
      required: true
      description: risk returns the principal header, direct attack paths, and the per-domain count grid. radius returns the radius target list.
      predefined:
      - risk
      - radius
    outputs:
    - contextPath: SpecterOpsBloodHoundEnterprise.Impact.Name
      description: Principal name returned by BloodHound search.
      type: String
    - contextPath: SpecterOpsBloodHoundEnterprise.Impact.ObjectID
      description: BloodHound object ID of the principal.
      type: String
    - contextPath: SpecterOpsBloodHoundEnterprise.Impact.PrincipalType
      description: BloodHound type used for the lookup (User, Computer, or Group).
      type: String
    - contextPath: SpecterOpsBloodHoundEnterprise.Impact.View
      description: Requested view, risk or radius.
      type: String
    - contextPath: SpecterOpsBloodHoundEnterprise.Impact.Partial
      description: True when paging stopped after retries and the result is incomplete.
      type: Boolean
    - contextPath: SpecterOpsBloodHoundEnterprise.Impact.LastUpdated
      description: Entity lastseen, or lastlogontimestamp when lastseen is empty. Returned for the risk view.
      type: String
    - contextPath: SpecterOpsBloodHoundEnterprise.Impact.DirectAttackPaths
      description: Direct relationship findings for the risk view.
      type: Unknown
    - contextPath: SpecterOpsBloodHoundEnterprise.Impact.DirectAttackPaths.Domain
      description: Environment name of a direct attack path.
      type: String
    - contextPath: SpecterOpsBloodHoundEnterprise.Impact.DirectAttackPaths.AttackPath
      description: Finding name of a direct attack path.
      type: String
    - contextPath: SpecterOpsBloodHoundEnterprise.Impact.AttackPathCount
      description: Number of direct relationship findings.
      type: Number
    - contextPath: SpecterOpsBloodHoundEnterprise.Impact.TierZero
      description: Yes when any direct finding is in the Tier Zero zone.
      type: String
    - contextPath: SpecterOpsBloodHoundEnterprise.Impact.TierZeroDomains
      description: Environment names of Tier Zero findings.
      type: Unknown
    - contextPath: SpecterOpsBloodHoundEnterprise.Impact.Rows
      description: Per-domain count grid. Returned for the risk view.
      type: Unknown
    - contextPath: SpecterOpsBloodHoundEnterprise.Impact.Rows.Domain
      description: Domain name for a grid row.
      type: String
    - contextPath: SpecterOpsBloodHoundEnterprise.Impact.Rows.T0
      description: Y when the domain has a Tier Zero finding, otherwise N.
      type: String
    - contextPath: SpecterOpsBloodHoundEnterprise.Impact.Rows.AP
      description: Direct attack-path count for the domain.
      type: Number
    - contextPath: SpecterOpsBloodHoundEnterprise.Impact.Rows.OOC
      description: Outbound object control count for the domain.
      type: Number
    - contextPath: SpecterOpsBloodHoundEnterprise.Impact.Rows.AR
      description: Admin rights count for the domain.
      type: Number
    - contextPath: SpecterOpsBloodHoundEnterprise.Impact.Rows.RDP
      description: RDP rights count for the domain.
      type: Number
    - contextPath: SpecterOpsBloodHoundEnterprise.Impact.Rows.DCOM
      description: DCOM rights count for the domain.
      type: Number
    - contextPath: SpecterOpsBloodHoundEnterprise.Impact.Rows.PS
      description: PowerShell remoting count for the domain.
      type: Number
    - contextPath: SpecterOpsBloodHoundEnterprise.Impact.Rows.SQL
      description: SQL admin count for the domain. Zero for computers and groups.
      type: Number
    - contextPath: SpecterOpsBloodHoundEnterprise.Impact.Rows.CD
      description: Constrained delegation count for the domain. Zero for groups.
      type: Number
    - contextPath: SpecterOpsBloodHoundEnterprise.Impact.Rows.Sess
      description: Session count for the domain.
      type: Number
    - contextPath: SpecterOpsBloodHoundEnterprise.Impact.Categories
      description: Radius target blocks, one per control category with results. Returned for the radius view.
      type: Unknown
    - contextPath: SpecterOpsBloodHoundEnterprise.Impact.Categories.ControlCategory
      description: Control category display name, for example Admin Rights.
      type: String
    - contextPath: SpecterOpsBloodHoundEnterprise.Impact.Categories.Returned
      description: Total objects BloodHound reported for the control category.
      type: Number
    - contextPath: SpecterOpsBloodHoundEnterprise.Impact.Categories.Targets
      description: First 100 targets for the control category.
      type: Unknown
    - contextPath: SpecterOpsBloodHoundEnterprise.Impact.Categories.Targets.Name
      description: Target object name.
      type: String
    - contextPath: SpecterOpsBloodHoundEnterprise.Impact.Categories.Targets.Type
      description: Target label, for example Computer.
      type: String
    - contextPath: SpecterOpsBloodHoundEnterprise.Impact.Categories.Targets.Domain
      description: Domain parsed from the target name. Empty when the name has no domain.
      type: String
    description: Returns BloodHound Enterprise risk details, including the domain grid, or the radius target list for one principal.
  type: python
  dockerimage: demisto/python3:3.12.13.10116658
  subtype: python3
  isfetch: true
  runonce: false
  isFetchSamples: true
fromversion: 6.10.0
tests:
- No tests (auto formatted)
