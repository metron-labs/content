category: Analytics & SIEM
provider: Flare
sectionorder:
- Connect
- Collect
commonfields:
  id: Flare Exposure Event Collector
  version: -1
configuration:
- display: Server URL
  name: url
  defaultvalue: https://api.flare.io
  type: 0
  required: false
  section: Connect
- display: API Key
  name: api_key
  type: 4
  required: true
  section: Connect
  additionalinfo: Flare API key from the Flare profile page. The collector sends this key to POST /tokens/generate and uses the returned token for the feed.
- display: Fetch events
  name: isFetchEvents
  type: 8
  defaultvalue: 'true'
  required: false
  section: Collect
  additionalinfo: Stores Flare events in the dataset. Leave this checked.
- display: Fetch Via Alerts
  name: fetch_alerts
  type: 8
  required: false
  section: Collect
  additionalinfo: Read each saved Flare alert and fetch tenant events with that alert's categories and severities. The instance severity and category are not sent. Disabled alerts are skipped. A later switch continues from the last stored event instead of repeating the backfill.
- display: Enable Direct Alert Promotion
  name: enable_direct_alert_promotion
  type: 8
  defaultvalue: 'false'
  required: false
  section: Collect
  additionalinfo: Stores each Flare event in the dataset and opens one XSIAM issue for it directly. Leave Fetch events checked. Use this or the correlation rules, not both.
- display: Flare tenants
  name: tenants
  type: 0
  required: false
  section: Collect
  additionalinfo: Comma-separated numeric tenant IDs from the Flare profile page. Leave empty to use the API key's default tenant.
- display: Instance tag
  name: instance_tag
  type: 0
  required: false
  section: Collect
  additionalinfo: Text written onto every event as flare_instance_tag. Filter events, issues, and cases with this value to see which instance collected them.
- display: Flare severity
  name: severity
  type: 16
  required: false
  section: Collect
  additionalinfo: Severities to ingest. Leave empty to ingest every severity.
  options:
  - info
  - low
  - medium
  - high
  - critical
- display: Flare category
  name: event_types
  type: 16
  required: false
  section: Collect
  additionalinfo: Flare event categories to ingest. Leave empty to ingest every category. Leaked Credentials and Look-alike Domains expand to the event types inside those groups.
  options:
  - Illicit Networks
  - Open Web
  - Intelligence Objects
  - Leaked Credentials
  - Look-alike Domains
  - Emerging Source
- display: Initial backfill
  name: first_fetch
  type: 0
  defaultvalue: 30 days
  required: false
  section: Collect
  additionalinfo: How far back to read on the first fetch. Maximum is 180 days. Example, 7 days or 30 days.
- display: Maximum number of events per fetch
  name: max_fetch
  type: 0
  defaultvalue: '50'
  required: false
  section: Collect
  additionalinfo: Upper bound for one fetch cycle across all selected tenants. Maximum is 500. The Flare feed returns 10 events per page.
- display: Events Fetch Interval
  name: eventFetchInterval
  type: 19
  defaultvalue: '10'
  required: false
  section: Collect
  additionalinfo: Minutes between fetches.
- display: Fetch full event
  name: fetch_full_event
  type: 8
  required: false
  section: Collect
  additionalinfo: When enabled, each feed event is enriched with GET /firework/v4/events/ and the data block is stored with the event. Leave this off to store the tenant feed record only.
- display: Trust any certificate (not secure)
  name: insecure
  type: 8
  required: false
  advanced: true
  section: Connect
- display: Use system proxy settings
  name: proxy
  type: 8
  required: false
  advanced: true
  section: Connect
description: Collects Flare threat exposure events into the flare_exposure_events_raw dataset.
display: Flare Exposure Event Collector
name: Flare Exposure Event Collector
script:
  script: '-'
  type: python
  subtype: python3
  isfetch: false
  isfetchevents: true
  dockerimage: demisto/python3:3.12.13.10116658
  commands:
  - name: flare-exposure-get-events
    description: Retrieves Flare events on demand. Set should_push_events to true to also store them in XSIAM.
    arguments:
    - name: should_push_events
      description: Set to true to store the events. Otherwise the command only displays them.
      defaultValue: 'false'
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
      required: true
    - name: limit
      description: Maximum number of events to return.
      defaultValue: '10'
    - name: from
      description: How far back to read, for example 12 hours or 7 days. Defaults to the instance backfill.
marketplaces:
- marketplacev2
- platform
fromversion: 8.4.0
tests:
- No tests (auto formatted)
supportedModules:
- xsiam
