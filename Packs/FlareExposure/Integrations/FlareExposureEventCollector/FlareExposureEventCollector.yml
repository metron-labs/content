category: Analytics & SIEM
provider: Flare
sectionorder:
- Connect
- Collect
commonfields:
  id: Flare
  version: -1
configuration:
- display: Instance tag
  name: instance_tag
  type: 0
  required: false
  section: Connect
  additionalinfo: Text written onto every event as flare_instance_tag. Filter events, issues, and cases with this value to see which instance collected them.
- display: Server URL
  name: url
  defaultvalue: https://api.flare.io
  type: 0
  required: false
  section: Connect
- display: API Key
  name: api_key
  type: 4
  required: true
  section: Connect
  additionalinfo: Flare API key from the Flare profile page. The collector sends this key to POST /tokens/generate and uses the returned token for the feed.
- display: Flare tenants
  name: tenants
  type: 0
  required: false
  section: Connect
  additionalinfo: Comma-separated numeric tenant IDs from the Flare profile page. Leave empty to use the API key's default tenant.
- display: XSIAM server URL
  name: xsiam_url
  type: 0
  required: false
  section: Connect
  additionalinfo: Cortex API URL used by Enable Direct Alert Promotion and by the case-closure playbook. Example, https://api-<tenant>.xdr.<region>.paloaltonetworks.com.
- display: XSIAM API Key
  name: xsiam_api_key
  type: 4
  required: false
  section: Connect
  additionalinfo: Cortex API key used by Enable Direct Alert Promotion and by the case-closure playbook. This is not the Flare API key.
- display: XSIAM API Key ID
  name: xsiam_api_key_id
  type: 0
  required: false
  section: Connect
  additionalinfo: Cortex API key ID sent as x-xdr-auth-id. Used by Enable Direct Alert Promotion and by the case-closure playbook.
- display: Fetch events
  name: isFetchEvents
  type: 8
  defaultvalue: 'true'
  required: false
  section: Collect
  additionalinfo: Stores Flare events in the dataset. Leave this checked.
- display: Fetch Via Alerts
  name: fetch_alerts
  type: 8
  required: false
  section: Collect
  additionalinfo: Read each saved Flare alert and fetch tenant events with that alert's categories and severities. The instance severity and category are not sent. Disabled alerts are skipped. A later switch continues from the last stored event instead of repeating the backfill.
- display: Enable Direct Alert Promotion
  name: enable_direct_alert_promotion
  type: 8
  defaultvalue: 'false'
  required: false
  section: Collect
  additionalinfo: Stores each Flare event in the dataset and opens one XSIAM alert for it through the Cortex alerts API. Requires the XSIAM server URL, API key, and API key ID. Leave Fetch events checked. Use this or the correlation rules, not both.
- display: Enable Status Write-back - Auto Closure/Remediation
  name: enable_status_writeback
  type: 8
  defaultvalue: 'false'
  required: false
  section: Collect
  additionalinfo: Not used by the event fetch. Flare status updates run from the playbook Flare - Case Closure Status Write-back when the case is resolved.
- display: Flare severity
  name: severity
  type: 16
  required: false
  section: Collect
  additionalinfo: Severities to ingest. Leave empty to ingest every severity.
  options:
  - info
  - low
  - medium
  - high
  - critical
- display: Flare category
  name: event_types
  type: 16
  required: false
  section: Collect
  additionalinfo: Flare event categories to ingest. Leave empty to ingest every category. A category selects every subtype in that group. A value such as open_web.paste selects that one subtype.
  options:
  - Illicit Networks
  - illicit_networks.listing
  - illicit_networks.forum_content
  - illicit_networks.blog_content
  - illicit_networks.profile
  - illicit_networks.chat_message
  - illicit_networks.ransomleak
  - illicit_networks.infected_devices
  - illicit_networks.financial_data
  - Open Web
  - open_web.paste
  - open_web.social_media
  - open_web.source_code
  - open_web.google
  - open_web.service
  - open_web.buckets
  - Leaked Credentials
  - leaks.leak
  - leaks.valid_credential
  - leaks.invalid_credential
  - leaks.mitigated_credential
  - Look-alike Domains
  - lookalike_discovery.lookalike_discovery
- display: Initial backfill
  name: first_fetch
  type: 0
  defaultvalue: 30 days
  required: false
  section: Collect
  additionalinfo: How far back to read on the first fetch. Maximum is 180 days. Example, 7 days or 30 days.
- display: Maximum number of events per fetch
  name: max_fetch
  type: 0
  defaultvalue: '50'
  required: false
  section: Collect
  additionalinfo: Upper bound for one fetch cycle across all selected tenants. Maximum is 500. The Flare feed returns 10 events per page.
- display: Events Fetch Interval
  name: eventFetchInterval
  type: 19
  defaultvalue: '10'
  required: false
  section: Collect
  additionalinfo: Minutes between fetches.
- display: Fetch full event
  name: fetch_full_event
  type: 8
  required: false
  section: Collect
  additionalinfo: When enabled, each feed event is enriched with GET /firework/v4/events/ and the data block is stored with the event. Leave this off to store the tenant feed record only.
- display: Trust any certificate (not secure)
  name: insecure
  type: 8
  required: false
  advanced: true
  section: Connect
- display: Use system proxy settings
  name: proxy
  type: 8
  required: false
  advanced: true
  section: Connect
description: Collects Flare threat exposure events into the flare_events_raw dataset.
display: Flare
name: Flare
script:
  script: '-'
  type: python
  subtype: python3
  isfetch: false
  isfetchevents: true
  dockerimage: demisto/python3:3.12.13.10116658
  commands:
  - name: flare-get-events
    description: Retrieves Flare events on demand. Set should_push_events to true to also store them in XSIAM.
    arguments:
    - name: should_push_events
      description: Set to true to store the events. Otherwise the command only displays them.
      defaultValue: 'false'
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
      required: true
    - name: limit
      description: Maximum number of events to return.
      defaultValue: '10'
    - name: from
      description: How far back to read, for example 12 hours or 7 days. Defaults to the instance backfill.
  - name: flare-get-event-details
    description: Retrieves one Flare event, including its data block. Password fields are removed.
    arguments:
    - name: event_id
      description: Flare event id.
      required: true
  - name: flare-get-profile
    description: Retrieves the Flare account profile for the configured API key.
  - name: flare-get-tenants
    description: Lists the Flare tenants the configured API key can access.
  - name: flare-get-credentials
    description: Retrieves one page of leaked credentials for a Flare tenant. Password fields are removed.
    arguments:
    - name: tenant_id
      description: Flare tenant id. Defaults to the first tenant configured on the instance.
    - name: limit
      description: Maximum number of credentials to return. Default is 20. Maximum is 100.
      defaultValue: '20'
    - name: from
      description: Page cursor returned by the previous call. Leave empty to read the first page.
  - name: flare-update-event-status
    description: Marks Flare events remediated. Pass a Flare event id, or a case id to update every Flare event on that case.
    arguments:
    - name: event_id
      description: Flare event id to mark remediated. Several ids can be comma-separated.
    - name: case_id
      description: XSIAM case id. The command reads that case's alerts and marks each Flare event remediated.
marketplaces:
- marketplacev2
- platform
fromversion: 8.4.0
tests:
- No tests (auto formatted)
supportedModules:
- xsiam
